<div class="youtube-embed">
  <iframe
    src="https://www.youtube.com/embed/{{ .Id }}?rel=0"
    title="{{ .Title }}"
    frameborder="0"
    allowfullscreen
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    loading="lazy"
    style="width: 100%; height: 100%;"
  ></iframe>
</div>
