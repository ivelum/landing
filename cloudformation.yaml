AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  BucketName:
    Type: String
  WebsiteCertificateARN:
    Type: String
  CorsAllowedOrigins:
    Type: String
    Default: "https://ivelum.com"
    Description: Comma-separated list of allowed origins for CORS

Resources:
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Ref: BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
            - '*'
            AllowedMethods:
             - GET
            AllowedHeaders:
            - Authorization
            - Content-Length
            MaxAge: 3600
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: 404.html

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: WebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Action: "s3:GetObject"
            Effect: Allow
            Principal: "*"
            Resource:
              Fn::Sub: "arn:aws:s3:::${WebsiteBucket}/*"

  WebsiteRedirectFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-redirects'
      AutoPublish: true
      FunctionConfig:
        Comment: Exact-path redirects for the website
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
            // Ignore trailing slashes in both request paths and redirect keys.
            // Destinations may be local paths or full HTTPS URLs.
            // Original query parameters are intentionally not forwarded.
            var redirects = {
                '/blog/dont-start-with-mobile/': { location: '/blog/why-most-startups-shouldnt-start-with-a-mobile-app/', statusCode: 301 },
                '/admin': { location: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ', statusCode: 302 },
                '/consultation': { location: 'https://calendly.com/ivelum/consultation', statusCode: 302 },
            };

            var request = event.request;
            var path = request.uri.replace(/\/+$/, '') || '/';
            var paths = Object.keys(redirects);
            var redirect;
            for (var i = 0; i < paths.length; i++) {
                if ((paths[i].replace(/\/+$/, '') || '/') === path) {
                    redirect = redirects[paths[i]];
                    break;
                }
            }
            if (!redirect) {
                return request;
            }

            return {
                statusCode: redirect.statusCode,
                statusDescription: redirect.statusCode === 302 ? 'Found' : 'Moved Permanently',
                headers: {
                    location: { value: redirect.location }
                }
            };
        }

  WebsiteDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: WebsiteBucket
    Properties:
      DistributionConfig:
        HttpVersion: http2and3
        Aliases:
          - ivelum.com
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
        Origins:
          - DomainName:
              Fn::Select:
                - 2
                - Fn::Split:
                    - '/'
                    - Fn::GetAtt:
                        - WebsiteBucket
                        - WebsiteURL
            Id:
              Ref: WebsiteBucket
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: 'http-only'
        Enabled: 'true'
        DefaultRootObject: index.html
        DefaultCacheBehavior:
          TargetOriginId:
            Ref: WebsiteBucket
          ViewerProtocolPolicy: 'redirect-to-https'
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt WebsiteRedirectFunction.FunctionMetadata.FunctionARN
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: true
          # ID of the CachingOptimized managed policy, taken from the docs:
          # https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-managed-cache-policies.html#managed-cache-caching-optimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        ViewerCertificate:
          AcmCertificateArn:
            Ref: WebsiteCertificateARN
          MinimumProtocolVersion: TLSv1.2_2018
          SslSupportMethod: sni-only

  DeployUser:
    Type: AWS::IAM::User
    Properties:
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCloudFormationReadOnlyAccess
      Policies:
        - PolicyDocument:
            Statement:
              - Action:
                  - s3:ListBucket
                Effect: Allow
                Resource:
                  Fn::Sub: "arn:aws:s3:::${WebsiteBucket}"
              - Action:
                  - s3:*Object*
                Effect: Allow
                Resource:
                  Fn::Sub: "arn:aws:s3:::${WebsiteBucket}/*"
              - Action:
                  - cloudfront:CreateInvalidation
                Effect: Allow
                Resource: "*"
              - Action:
                  - lambda:GetFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                Effect: Allow
                Resource: !GetAtt LandingLambda.Arn
          PolicyName: manage-static-website

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: "ses-send-email"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "ses:SendEmail"
                  - "ses:SendRawEmail"
                Resource: "*"

  LandingLambda:
    Type: "AWS::Lambda::Function"
    Properties:
      Handler: "handler.lambda_handler"
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        # use CF feature - it compares yaml config with its previous version
        # without looking at the actual state of the lambda function
        # this way we can update code, deps and env vars during deploy
        ZipFile: import this
      Runtime: "python3.10"
      Timeout: 10

  LandingLambdaUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      Cors:
        AllowOrigins: !Split [',', !Ref CorsAllowedOrigins]
        ExposeHeaders:
          - '*'
        AllowHeaders:
          - '*'
        AllowMethods:
          - '*'
        MaxAge: 0
        AllowCredentials: false
      TargetFunctionArn: !GetAtt LandingLambda.Arn

  # Create permission for API Gateway to invoke Lambda
  LandingPermission:
    Type: 'AWS::Lambda::Permission'
    Properties:
      Action: lambda:invokeFunctionUrl
      FunctionName: !Ref LandingLambda
      FunctionUrlAuthType: 'NONE'
      Principal: '*'

Outputs:
  LandingInvokeURL:
    Value: !GetAtt LandingLambdaUrl.FunctionUrl
    Description: URL for invoking the API function
